AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Reference API for Education Data Analytics Pipeline

  SAM Template for the API of the reference pipeline

Parameters:
  pEnv:
    Type: String
    Description: Name of the Environment
  pCognitoUserPoolArn:
    Type: String
    Description: ARN of the Cognito User Pool
  pSensitiveDBIamUser:
    Type: String
    Description: The IAM username with access to the sensitive data database
  pSensitiveDBHost:
    Description: Database host name for the "sensitive" data database
    Type: String  
  pSensitiveDBName:
    Description: Database Name for "sensitive" data
    Type: String  
  pSensitiveDBPort:
    Description: TCP/IP Port for the "Sensitive" Database Instance
    Type: Number
    Default: 5432
  pSensitiveDBSecurityGroup:
    Description: Security Group for the "Sensitive" Database Instance
    Type: String
  pPublishedDBIamUser:
    Type: String
    Description: The IAM username with access to the "published" data database
  pPublishedDBHost:
    Description: Database host name for the "published" data database
    Type: String  
  pPublishedDBName:
    Description: Database Name for "published" data
    Type: String  
  pPublishedDBPort:
    Description: TCP/IP Port for the "Published" Database Instance
    Type: Number
    Default: 5432
  pPublishedDBSecurityGroup:
    Description: Security Group for the "Published" Database Instance
    Type: String
  pPrivateSubnets:
    Description: Private subnets within the same VPC as the database
    Type: List<AWS::EC2::Subnet::Id>
  pEncryptionKey:
    Type: String
    NoEcho: true
    Description: The encryption key for the psuedo anonymization
  pCreateAlarms:
    Type: String
    Default: 'False'
    AllowedValues: ['True','False']
    Description: Create CloudWatch Alarms
  pNotificationList:
    Type: String
    Description: The Email notification list is used to configure a SNS topic for sending cloudwatch alarm and RDS Event notifications
    AllowedPattern: '^(([^<>()\[\]\\.,;:\s@"]+(\.[^<>()\[\]\\.,;:\s@"]+)*)|(".+"))@((\[[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}])|(([a-zA-Z\-0-9]+\.)+[a-zA-Z]{2,}))$'
    ConstraintDescription: provide a valid email address.

Conditions:
  CreateAlarms: !Equals 
    - !Ref pCreateAlarms
    - 'True'

Resources:

  AnalyticsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: api
      Auth:
        DefaultAuthorizer: ClientCognitoAuthorizer
        Authorizers:
          ClientCognitoAuthorizer:
            UserPoolArn: !Ref pCognitoUserPoolArn
            AuthorizationScopes:
              - analytics/api
#      TODO: author API documentation
#      SAM will automatically generate this API documentation
#      
#      DefinitionBody:
#        Fn::Transform:
#          Name: AWS::Include
#          Parameters:
#            Location: ./openapi.yaml

  EduApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${pEnv}EduApiIngestFunction
      Handler: eduapi.lambdaHandler
      CodeUri: eduapi/
      Runtime: nodejs20.x
      MemorySize: 256
      Timeout: 30
      Architectures:
        - x86_64
      VpcConfig: 
        SecurityGroupIds: 
          - !Ref pSensitiveDBSecurityGroup
        SubnetIds: !Ref pPrivateSubnets
        Ipv6AllowedForDualStack: true
      Events:
        EduApiData:
          Type: Api
          Properties:
            RestApiId: !Ref AnalyticsApi
            Path: /eduapi/{version}/{schema}
            Method: POST
      Environment:
        Variables:
          SQSInjestQueueUrl: !Ref SQSInjestQueue
          AwsRegion: !Ref AWS::Region
          NODE_OPTIONS: --enable-source-maps
      Layers:
        - !Ref SchemaLayer
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: RDSConnectPolicy
              Effect: Allow
              Action:
                - rds-db:connect
              Resource: !Sub arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:*/${pSensitiveDBIamUser}
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SQSInjestQueue.QueueName
    Metadata: # Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2020"
        Sourcemap: true
        EntryPoints: 
          - eduapi.ts
        
  CaliperFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${pEnv}CaliperIngestFunction
      Handler: caliper.lambdaHandler
      CodeUri: caliper/
      Runtime: nodejs20.x
      MemorySize: 256
      Timeout: 30
      Architectures:
        - x86_64
      VpcConfig: 
        SecurityGroupIds: 
          - !Ref pSensitiveDBSecurityGroup
        SubnetIds: !Ref pPrivateSubnets
        Ipv6AllowedForDualStack: true
      Events:
        EduApiData:
          Type: Api
          Properties:
            RestApiId: !Ref AnalyticsApi
            Path: /caliper
            Method: POST
      Environment:
        Variables:
          SQSInjestQueueUrl: !Ref SQSInjestQueue
          AwsRegion: !Ref AWS::Region
          NODE_OPTIONS: --enable-source-maps
      Layers:
        - !Ref SchemaLayer
      Policies:
        - AWSLambdaBasicExecutionRole
        - SQSSendMessagePolicy:
            QueueName: !GetAtt SQSInjestQueue.QueueName
    Metadata: # Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2020"
        Sourcemap: true
        EntryPoints: 
          - caliper.ts

  SQSInjestQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: sqs-injest-queue
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt SQSInjestDLQ.Arn
        maxReceiveCount: 5
  
  SQSInjestDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: sqs-injest-dlq
      MessageRetentionPeriod: 345600  # 4 days

  SQSInjestEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref InjestDbWriterFunction
      EventSourceArn: !GetAtt SQSInjestQueue.Arn
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 10
      Enabled: true
      ScalingConfig:
        MaximumConcurrency: 100
      FunctionResponseTypes:
        - ReportBatchItemFailures

  InjestDbWriterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${pEnv}IngestDbWriterFunction
      Handler: db-writer.lambdaHandler
      CodeUri: db-writer/
      Runtime: nodejs20.x
      MemorySize: 256
      Timeout: 30
      Architectures:
        - x86_64
      VpcConfig: 
        SecurityGroupIds: 
          - !Ref pSensitiveDBSecurityGroup
        SubnetIds: !Ref pPrivateSubnets
        Ipv6AllowedForDualStack: true
      Environment:
        Variables:
          AnonymizeSQSQueueUrl: !Ref AnonymizeSQSQueue
          DBHost: !Ref pSensitiveDBHost
          DBPort: !Ref pSensitiveDBPort
          DBName: !Ref pSensitiveDBName
          DBIamUser: !Ref pSensitiveDBIamUser
          AwsRegion: !Ref AWS::Region
          NODE_OPTIONS: --enable-source-maps
      Layers:
        - !Ref SchemaLayer
      Policies:
        - AWSLambdaBasicExecutionRole
        - Statement:
            - Sid: RDSConnectPolicy
              Effect: Allow
              Action:
                - rds-db:connect
              Resource: !Sub arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:*/${pSensitiveDBIamUser}
        - SQSSendMessagePolicy:
            QueueName: !GetAtt AnonymizeSQSQueue.QueueName
        - SQSPollerPolicy:
            QueueName: !GetAtt SQSInjestQueue.QueueName
    Metadata: # Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2020"
        Sourcemap: true
        EntryPoints: 
          - db-writer.ts

  SchemaLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: schemaDocs
      ContentUri: ./json-schema
      CompatibleRuntimes:
        - nodejs20.x

  AnonymizeSQSQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: anonymize-sqs-queue
      RedrivePolicy:
        deadLetterTargetArn: !GetAtt AnonymizeSQSDLQ.Arn
        maxReceiveCount: 5
  
  AnonymizeSQSDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: anonymize-sqs-dlq
      MessageRetentionPeriod: 345600  # 4 days

  AnonymizeSQSEventSource:
    Type: AWS::Lambda::EventSourceMapping
    Properties:
      FunctionName: !Ref AnonymizeSQSFunction
      EventSourceArn: !GetAtt AnonymizeSQSQueue.Arn
      BatchSize: 10
      MaximumBatchingWindowInSeconds: 10
      Enabled: true
      ScalingConfig:
        MaximumConcurrency: 100
      FunctionResponseTypes:
        - ReportBatchItemFailures

  AnonymizeSQSFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${pEnv}AnonymizeSQSFunction
      Handler: pseudoPii.handler
      CodeUri: pseudoPii/
      Runtime: nodejs20.x
      MemorySize: 256
      Timeout: 30
      Architectures:
        - x86_64
      VpcConfig: 
        SecurityGroupIds: 
          - !Ref pPublishedDBSecurityGroup
        SubnetIds: !Ref pPrivateSubnets
        Ipv6AllowedForDualStack: true
      Environment:
        Variables:
          DBHost: !Ref pPublishedDBHost
          DBPort: !Ref pPublishedDBPort
          DBName: !Ref pPublishedDBName
          DBIamUser: !Ref pPublishedDBIamUser
          AwsRegion: !Ref AWS::Region
          EncryptionKey: !Ref pEncryptionKey
          NODE_OPTIONS: --enable-source-maps
      Layers:
        - !Ref SchemaLayer
      Policies:
        - AWSLambdaBasicExecutionRole
        - SQSPollerPolicy:
            QueueName: !GetAtt AnonymizeSQSQueue.QueueName
        - Statement:
            - Sid: RDSConnectPolicy
              Effect: Allow
              Action:
                - rds-db:connect
              Resource: !Sub arn:aws:rds-db:${AWS::Region}:${AWS::AccountId}:dbuser:*/${pPublishedDBIamUser}
    Metadata:
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2020"
        Sourcemap: true
        EntryPoints: 
          - pseudoPii.ts

  AlarmTopic:
    Type: AWS::SNS::Topic
    Condition: CreateAlarms
    Properties:
      TopicName: !Sub ${pEnv}-queue-alarms
      Subscription:
        - Endpoint: !Ref pNotificationList
          Protocol: email

  # Message Age Alarms
  InjestQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateAlarms
    Properties:
      AlarmName: !Sub ${pEnv}-injest-queue-message-age
      AlarmDescription: "Alarm when messages are older than 48 hours in injest queue"
      MetricName: ApproximateAgeOfOldestMessage
      Namespace: AWS/SQS
      Dimensions:
        - Name: QueueName
          Value: sqs-injest-queue
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 172800  # 48 hours in seconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  AnonymizeQueueAgeAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateAlarms
    Properties:
      AlarmName: !Sub ${pEnv}-anonymize-queue-message-age
      AlarmDescription: "Alarm when messages are older than 48 hours in anonymize queue"
      MetricName: ApproximateAgeOfOldestMessage
      Namespace: AWS/SQS
      Dimensions:
        - Name: QueueName
          Value: anonymize-sqs-queue
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 172800  # 48 hours in seconds
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  # Message Count Alarms for Main Queues
  InjestQueueDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateAlarms
    Properties:
      AlarmName: !Sub ${pEnv}-injest-queue-depth
      AlarmDescription: "Alarm when more than 5000 messages in injest queue"
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Dimensions:
        - Name: QueueName
          Value: sqs-injest-queue
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  AnonymizeQueueDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateAlarms
    Properties:
      AlarmName: !Sub ${pEnv}-anonymize-queue-depth
      AlarmDescription: "Alarm when more than 5000 messages in anonymize queue"
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Dimensions:
        - Name: QueueName
          Value: anonymize-sqs-queue
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5000
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  # DLQ Alarms
  InjestDLQDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateAlarms
    Properties:
      AlarmName: !Sub ${pEnv}-injest-dlq-depth
      AlarmDescription: "Alarm when more than 500 messages in injest DLQ"
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Dimensions:
        - Name: QueueName
          Value: sqs-injest-dlq
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 500
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

  AnonymizeDLQDepthAlarm:
    Type: AWS::CloudWatch::Alarm
    Condition: CreateAlarms
    Properties:
      AlarmName: !Sub ${pEnv}-anonymize-dlq-depth
      AlarmDescription: "Alarm when more than 500 messages in anonymize DLQ"
      MetricName: ApproximateNumberOfMessagesVisible
      Namespace: AWS/SQS
      Dimensions:
        - Name: QueueName
          Value: anonymize-sqs-dlq
      Statistic: Average
      Period: 300
      EvaluationPeriods: 1
      Threshold: 500
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions:
        - !Ref AlarmTopic
      OKActions:
        - !Ref AlarmTopic

Outputs:

  AnalyticsApiEndpoint:
    Description: API Endpoint
    Value: !Sub "https://${AnalyticsApi}.execute-api.${AWS::Region}.amazonaws.com/api"
