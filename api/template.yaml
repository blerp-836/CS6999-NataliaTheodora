AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Reference API for Education Data Analytics Pipeline

  SAM Template for the API of the reference pipeline

Parameters:
  CognitoUserPoolArn:
    Type: String
    Description: ARN of the Cognito User Pool
  SensitiveDBIamUser:
    Type: String
    Description: The IAM username with access to the sensitive data database
  SensitiveDBHost:
    Description: Database host name
    Type: String  
  SensitiveDBName:
    Description: Database Name
    Type: String  
  SensitiveDBPort:
    Description: TCP/IP Port for the Database Instance
    Type: Number
    Default: 5432
  SensitiveDBSecurityGroup:
    Description: Security Group for the Database Instance
    Type: String
  PrivateSubnets:
    Description: Private subnets within the same VPC as the database
    Type: List<AWS::EC2::Subnet::Id>
Resources:

  AnalyticsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: api
      Auth:
        DefaultAuthorizer: ClientCognitoAuthorizer
        Authorizers:
          ClientCognitoAuthorizer:
            UserPoolArn: !Ref CognitoUserPoolArn
            AuthorizationScopes:
              - analytics/api
#      TODO: author API documentation
