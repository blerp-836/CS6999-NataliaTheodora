AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  Reference API for Education Data Analytics Pipeline

  SAM Template for the API of the reference pipeline

Parameters:
  CognitoUserPoolArn:
    Type: String
    Description: ARN of the Cognito User Pool

Resources:

  AnalyticsApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: api
      Auth:
        DefaultAuthorizer: ClientCognitoAuthorizer
        Authorizers:
          ClientCognitoAuthorizer:
            UserPoolArn: !Ref CognitoUserPoolArn
            AuthorizationScopes:
              - analytics/api
