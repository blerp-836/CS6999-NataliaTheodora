  # Remove this at a later date
  # just needed to verify that authentication applies to the root of the API
  AppFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: app.handler
      Runtime: nodejs20.x
      CodeUri: src/
      Events:
        RootEvent:
          Type: Api
          Properties:
            RestApiId: !Ref AnalyticsApi
            Path: /
            Method: POST
      Policies:
        - AWSLambdaBasicExecutionRole

  EduApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: eduapi.lambdaHandler
      CodeUri: eduapi/
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Events:
        EduApiData:
          Type: Api
          Properties:
            RestApiId: !Ref AnalyticsApi
            Path: /eduapi/{version}/{schema}
            Method: POST
      Environment:
        Variables:
          NODE_OPTIONS: --enable-source-maps
      Layers:
        - !Ref SchemaLayer
      Policies:
        - AWSLambdaBasicExecutionRole
    Metadata: # Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2020"
        Sourcemap: true
        EntryPoints: 
          - eduapi.ts
        
  CaliperFunction:
    Type: AWS::Serverless::Function
    Properties:
      Handler: caliper.lambdaHandler
      CodeUri: caliper/
      Runtime: nodejs20.x
      Architectures:
        - x86_64
      Events:
        EduApiData:
          Type: Api
          Properties:
            RestApiId: !Ref AnalyticsApi
            Path: /caliper
            Method: POST
      Environment:
        Variables:
          NODE_OPTIONS: --enable-source-maps
      Layers:
        - !Ref SchemaLayer
      Policies:
        - AWSLambdaBasicExecutionRole
#        - EduApiSQSInjestQueueAccessPolicy:
#            QueueName: !GetAtt EduApiSQSInjestQueue.QueueName
    Metadata: # Manage esbuild properties
      BuildMethod: esbuild
      BuildProperties:
        Minify: false
        Target: "es2020"
        Sourcemap: true
        EntryPoints: 
          - caliper.ts

  SchemaLayer:
    Type: AWS::Serverless::LayerVersion
    Properties:
      LayerName: schemaDocs
      ContentUri: ./json-schema
      CompatibleRuntimes:
        - nodejs20.x

